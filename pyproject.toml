[project]
name = "cascade-router"
version = "0.1.0"
description = "Route each LLM call to the cheapest model that will get it right — verifier-gated model cascades with an offline threshold optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshan@agulhascode.co.za" }]
keywords = ["llm", "inference", "routing", "model-cascade", "cost-optimization", "verification"]

dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/cascade"
Issues = "https://github.com/darrshangovender/cascade/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
